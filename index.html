<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ursin Performance Tracker (public view)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f8fb;--surface:#fff;--surface-2:#e8f2f7;--border:#d3e6ee;--text:#1a1d23;--text-dim:#6b7280;--accent:#0074AC;--accent-2:#03ABAE;--good:#16a34a;--warn:#d97706;--bad:#dc2626;--shadow:0 1px 3px rgba(20,20,30,.06);--radius:12px;font-family:'Inter',sans-serif;}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--text);}
.app{max-width:1080px;margin:0 auto;padding:20px 16px 60px;}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap;}
header.top h1{font-size:19px;margin:0;font-weight:700;}
.logo-badge{background:#fff;border-radius:8px;padding:3px;box-shadow:var(--shadow);}
.logo-badge img{height:34px;width:34px;display:block;object-fit:contain;}
.banner{background:rgba(0,116,172,.08);border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--text-dim);margin-bottom:18px;}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;}
.tab-btn{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
section.tab{display:none;} section.tab.active{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h2{margin:0 0 12px;font-size:15px;font-weight:700;}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:18px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);}
.stat .v{font-size:20px;font-weight:700;} .stat .l{font-size:11px;color:var(--text-dim);margin-top:2px;}
.chart-wrap{height:240px;position:relative;}
table{border-collapse:collapse;width:100%;font-size:12.5px;}
.table-wrap{overflow-x:auto;}
th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
th{color:var(--text-dim);font-weight:600;font-size:11px;text-transform:uppercase;}
.badge{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
.badge.good{background:rgba(22,163,74,.14);color:var(--good);}
.badge.warn{background:rgba(217,119,6,.14);color:var(--warn);}
.badge.bad{background:rgba(220,38,38,.14);color:var(--bad);}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;}
a{color:var(--accent);}
.plan-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.plan-cat{font-weight:700;font-size:14px;margin-bottom:6px;}
.plan-row{font-size:12.5px;margin-bottom:6px;}
.plan-row b{color:var(--text-dim);font-weight:600;}
.plan-months{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.plan-month{font-size:11px;padding:4px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function linkify(s){const e=esc(s);return e.replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);}

function renderTable(tableId, rows, cols){
  const t=document.getElementById(tableId);
  t.querySelector('thead')?.remove?.();
  t.innerHTML='<thead><tr>'+cols.map(c=>`<th>${c.label}</th>`).join('')+'</tr></thead><tbody></tbody>';
  const tbody=t.querySelector('tbody');
  if(!rows.length){tbody.innerHTML=`<tr><td colspan="${cols.length}">Chưa có dữ liệu.</td></tr>`;return;}
  rows.forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=cols.map(c=>`<td>${linkify(r[c.key])}</td>`).join('');tbody.appendChild(tr);});
}

const byWeek={};
DAILY.forEach(r=>{const wk=r.tuan!==undefined?String(r.tuan):'—';(byWeek[wk]=byWeek[wk]||[]).push(r);});
const weeks=Object.keys(byWeek).sort((a,b)=>parseFloat(a)-parseFloat(b));
const summary=weeks.map(wk=>{
  const items=byWeek[wk];
  const avg=k=>{const v=items.map(i=>i[k]).filter(x=>typeof x==='number');return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const sum=k=>items.map(i=>i[k]).filter(x=>typeof x==='number').reduce((a,b)=>a+b,0);
  const pct=(k,val)=>{const v=items.map(i=>i[k]).filter(x=>x!==undefined&&x!=='');return v.length?v.filter(x=>x===val).length/v.length:null;};
  return {week:wk,days:items.length,shiftAdaptation:avg('shiftAdaptation'),selfRating:avg('selfRating'),dailyReportPct:pct('dailyReport','Yes'),qc3Pct:pct('qc3','Pass'),opp:sum('opp'),cfLabel:sum('cfLabel'),skimming:sum('skimming')};
});
function fmtPct(v){return v==null||isNaN(v)?'—':Math.round(v*100)+'%';}
function avgOf(a){const v=a.filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function badgePct(v){if(v==null)return '—';const p=Math.round(v*100);const cls=p>=80?'good':(p>=50?'warn':'bad');return `<span class="badge ${cls}">${p}%</span>`;}

  <div class="plan-row"><b>Kế hoạch:</b> ${esc(p.action)}</div>
  <div class="plan-months">
    <span class="plan-month">T5: ${esc(p.may)}</span><span class="plan-month">T6: ${esc(p.june)}</span><span class="plan-month">T7: ${esc(p.july)}</span>
    <span class="plan-month">T9: ${esc(p.sep)}</span><span class="plan-month">T10: ${esc(p.oct)}</span><span class="plan-month">T11: ${esc(p.nov)}</span><span class="plan-month">T12: ${esc(p.dec)}</span>
  </div>`;
  planC.appendChild(d);
});

// Export to Excel (client-side, works without backend)
document.getElementById('exportBtn').onclick=function(){
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), 'Dashboard');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dailySorted), 'Nhat ky ca');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(oppSorted), 'OPP Tracker');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(soloSorted), 'Solo Shift Log');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(PLAN), 'Improvement Plan');
  XLSX.writeFile(wb, 'Ursin_Performance_Report.xlsx');
};
